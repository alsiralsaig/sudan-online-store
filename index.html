    <!--
      شاشة تحميل (Splash) تظهر فوراً قبل تحميل التطبيق.
      ------------------------------------------------------------------
      كانت الشاشة تعرض أجزاء من الواجهة والبانرات قبل جهوزها فيظهر نص فوق
      الصور. الشاشة هنا تُرسم من HTML/CSS فقط (تعمل قبل تحميل JavaScript)،
      ثم تُخفى بعد أول رسم كامل للتطبيق — أو بعد مدة أمان قصيرة.
    -->
    <style>
      html, body { margin: 0; background: #052e1a; }
      #sanad-boot {
        position: fixed; inset: 0; z-index: 2147483647;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        gap: 18px; background: radial-gradient(circle at 50% 38%, #0b3d2b 0%, #052e1a 62%, #04150d 100%);
        font-family: "Cairo", "Tajawal", system-ui, -apple-system, "Segoe UI", Tahoma, sans-serif;
        transition: opacity .35s ease, visibility .35s ease;
      }
      #sanad-boot.sanad-boot--hide { opacity: 0; visibility: hidden; pointer-events: none; }
      #sanad-boot img { width: 108px; height: 108px; object-fit: contain; border-radius: 26px;
        box-shadow: 0 18px 40px rgba(0,0,0,.45); }
      #sanad-boot .sb-name { color: #ecfdf5; font-size: 20px; font-weight: 800; letter-spacing: .5px; }
      #sanad-boot .sb-sub { color: #6ee7b7; font-size: 12px; font-weight: 600; margin-top: -10px; }
      #sanad-boot .sb-ring {
        width: 42px; height: 42px; border-radius: 50%;
        border: 3px solid rgba(110,231,183,.22); border-top-color: #34d399;
        animation: sb-spin 1.45s cubic-bezier(.45,.05,.55,.95) infinite;
      }
      @keyframes sb-spin { to { transform: rotate(360deg); } }
      #sanad-boot .sb-hint { color: rgba(236,253,245,.55); font-size: 11px; }
      /* شريط تقدّم رقيق أسفل الشاشة */
      #sanad-boot .sb-bar { position: absolute; inset-inline: 0; bottom: 0; height: 3px; overflow: hidden; background: rgba(52,211,153,.15); }
      #sanad-boot .sb-bar span { display: block; height: 100%; width: 40%; background: linear-gradient(90deg,#34d399,#0ea5e9);
        animation: sb-slide 2.2s ease-in-out infinite; }
      @keyframes sb-slide { 0% { transform: translateX(-100%); } 100% { transform: translateX(250%); } }
      @media (prefers-reduced-motion: reduce) {
        #sanad-boot .sb-ring, #sanad-boot .sb-bar span { animation-duration: 3s; }
      }
    </style>

    <!-- PWA Configuration for Android, iOS and Modern Desktop -->
    <!--
      كل تطبيق له manifest خاص ببدء تشغيل مختلف (?app=…)، وإلا يرى أندرويد
      الثلاثة كتطبيق واحد ويجعلها اختصاراً واحداً على الشاشة الرئيسية.
      السكربت يختار المانيفست حسب ?app في الرابط.
    -->
    <script>
      (function () {
        var app = new URLSearchParams(location.search).get('app') || '';
        var file =
          app === 'merchant' ? '/manifest-merchant.json' :
          app === 'super_admin' || app === 'saas' ? '/manifest-admin.json' :
          '/manifest-client.json';
        var link = document.createElement('link');
        link.rel = 'manifest';
        link.href = file;
        document.head.appendChild(link);
        document.documentElement.setAttribute('data-app', app || 'client');
      })();
    </script>
